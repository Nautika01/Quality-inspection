[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qinspect"
version = "0.3.0"
description = "Smart-factory quality inspection for precision defense parts: vision, anomaly detection, SPC, MSA, traceability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "streamlit>=1.49", "paho-mqtt>=2.0", "pydantic>=2.0"]
dev = ["pytest>=7", "httpx>=0.25", "qinspect[server]"]

[project.scripts]
qinspect = "qinspect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
